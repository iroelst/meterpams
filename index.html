<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b55"><title>Meter Pams — Tagihan Air Bersih</title>
<style>
:root{--g:#0b6b55;--mint:#e8f6f1;--ink:#18322b;--muted:#6d7d78;--line:#e2ebe6;--bg:#f4f7f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,Arial,sans-serif}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#103e34;color:#e7f4ef;padding:20px 13px}.brand{display:flex;gap:10px;align-items:center;padding:5px 9px 22px}.logo{background:#d5f3e6;color:var(--g);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;font-size:25px;font-weight:bold}.brand b{font-size:17px}.brand small{display:block;color:#a9cec2}.label{font-size:10px;color:#8bb8aa;letter-spacing:1px;margin:15px 12px 7px;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{border:0;background:none;color:#c7e0d7;text-align:left;padding:11px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#1c5b4c;color:white}.main{min-width:0}.top{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 25px;position:sticky;top:0}.top small{color:var(--muted)}.pill{background:var(--mint);color:var(--g);border-radius:30px;padding:8px 12px;font-size:12px;font-weight:bold}.content{padding:25px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.head h1{font-size:25px;margin:0 0 4px}.muted{color:var(--muted)}button,.btn{font:inherit}.btn{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:white;font-weight:700;cursor:pointer}.primary{background:var(--g);border-color:var(--g);color:white}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px #173b2b08}.card{padding:17px}.card small{color:var(--muted)}.value{font-size:25px;font-weight:800;margin:8px 0}.panel{overflow:hidden;margin:16px 0}.panelhead{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:750}.panelbody{padding:18px}.notice{padding:14px;border:1px solid #f0dfae;background:#fff5dc;color:#76561c;border-radius:12px;margin-bottom:18px}.empty{padding:32px 12px;text-align:center;border:1px dashed #d5e2dc;border-radius:11px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700;color:#52635d}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d8e3de;border-radius:8px;background:#fff}.field.full{grid-column:1/-1}.formfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hint{font-size:11px;color:var(--muted)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.mobile{display:none}
@media(max-width:850px){.app{grid-template-columns:190px 1fr}.cards{grid-template-columns:repeat(2,1fr)}.content{padding:17px}.top{padding:0 16px}}
@media(max-width:620px){.app{display:block}.side{position:fixed;z-index:9;top:0;bottom:0;left:-260px;width:245px;transition:.2s;overflow:auto}.side.open{left:0}.mobile{display:inline-block}.top{height:64px;padding:0 12px}.content{padding:15px 12px}.head h1{font-size:22px}.cards{gap:8px}.card{padding:12px}.value{font-size:21px}.grid2,.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.pill{display:none}}
</style></head><body>
<div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">≈</div><div><b>Meter Pams</b><small>Manajemen Air Bersih</small></div></div>
<div class="label">Menu utama</div><nav class="nav">
<button class="active" data-p="Dashboard">▦ &nbsp; Dashboard</button><button data-p="Pelanggan">♙ &nbsp; Pelanggan</button><button data-p="Catat Meter">◷ &nbsp; Catat Meter</button><button data-p="Tagihan">▤ &nbsp; Tagihan</button><button data-p="Pembayaran">↗ &nbsp; Pembayaran</button><button data-p="Tunggakan">! &nbsp; Tunggakan</button><button data-p="Laporan">▥ &nbsp; Laporan</button>
</nav><div class="label">Pengaturan</div><nav class="nav"><button data-p="Area">⌖ &nbsp; Area</button><button data-p="Jenis Pelanggan">◇ &nbsp; Jenis Pelanggan</button><button data-p="Data Meter">◉ &nbsp; Data Meter</button><button data-p="Tarif Bertingkat">≋ &nbsp; Tarif Bertingkat</button><button data-p="Admin & Petugas">♧ &nbsp; Admin & Petugas</button><button data-p="Pengaturan & Backup">⚙ &nbsp; Pengaturan & Backup</button></nav></aside>
<main class="main"><header class="top"><div><button class="btn mobile" id="menu">☰</button> <small>BUMDesa / Meter Pams</small><div id="title" style="font-size:17px;font-weight:800">Dashboard</div></div><span class="pill">● Mode rancangan</span></header><div class="content" id="content"></div></main></div>
<script>
const content=document.getElementById('content');
const empty=(title,desc)=>`<div class="head"><div><h1>${title}</h1><div class="muted">${desc}</div></div><button class="btn primary" onclick="toast('Backend belum terpasang; data belum disimpan.')">＋ Tambah</button></div><section class="panel"><div class="panelhead">${title}</div><div class="panelbody"><div class="empty"><div style="font-size:28px">▤</div><b>Belum ada data yang dimuat</b>${desc}<p class="hint">Tidak ada data contoh yang digunakan sebagai data produksi.</p></div></div></section>`;
function page(p){document.getElementById('title').textContent=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));document.getElementById('side').classList.remove('open');
if(p==='Dashboard'){content.innerHTML=`<div class="notice"><b>Mode rancangan — belum terhubung ke database</b><br>Antarmuka ini belum menyimpan transaksi. Kita akan menghubungkannya ke Neon melalui backend Cloudflare Workers setelah API dan login aman siap.</div><div class="head"><div><h1>Dashboard</h1><div class="muted">Ringkasan operasional layanan air bersih.</div></div><button class="btn primary" onclick="page('Catat Meter')">＋ Catat meter</button></div><div class="cards">${[['Pelanggan aktif','—'],['Tagihan periode ini','—'],['Pembayaran masuk','—'],['Total tunggakan','—']].map(x=>`<div class="card"><small>${x[0]}</small><div class="value">${x[1]}</div><small>Menunggu koneksi API</small></div>`).join('')}</div><div class="grid2"><section class="panel"><div class="panelhead">Aktivitas terbaru</div><div class="panelbody"><div class="empty"><b>Belum ada aktivitas</b>Aktivitas muncul setelah database terhubung.</div></div></section><section class="panel"><div class="panelhead">Alur kerja bulanan</div><div class="panelbody">01 &nbsp; Catat meter pelanggan<br><br>02 &nbsp; Hitung tarif bertingkat<br><br>03 &nbsp; Terbitkan tagihan<br><br>04 &nbsp; Catat pembayaran tunai/transfer<br><br>05 &nbsp; Pantau tunggakan dan laporan</div></section></div>`}
else if(p==='Catat Meter') form(p,[['customer_id','Pelanggan','select'],['period','Periode tagihan','month'],['previous_reading','Angka meter sebelumnya (m³)','number'],['current_reading','Angka meter sekarang (m³)','number'],['recorded_by','Nama petugas','text'],['notes','Catatan','textarea']]);
else if(p==='Pembayaran') form(p,[['bill_id','Tagihan','select'],['amount','Jumlah pembayaran (Rp)','number'],['method','Metode pembayaran','method'],['reference_no','Referensi transfer','text'],['received_by','Diterima oleh','text'],['notes','Catatan','textarea']]);
else if(p==='Tarif Bertingkat') form(p,[['customer_type_id','Jenis pelanggan','select'],['min_usage','Pemakaian minimum (m³)','number'],['max_usage','Pemakaian maksimum (m³), kosong jika tanpa batas','number'],['rate_per_m3','Tarif per m³ (Rp)','number']]);
else if(p==='Pengaturan & Backup') content.innerHTML=`<div class="head"><div><h1>${p}</h1><div class="muted">Konfigurasi organisasi dan pencadangan data.</div></div></div><section class="panel"><div class="panelhead">Pengaturan usaha</div><div class="panelbody"><div class="fields"><div class="field"><label>Nama BUMDesa</label><input placeholder="Isi setelah konfigurasi"></div><div class="field"><label>Denda tetap per bulan (Rp)</label><input type="number" min="0"></div><div class="field"><label>Tanggal jatuh tempo (1–28)</label><input type="number" min="1" max="28"></div></div><p class="hint">Rancangan saja; belum disimpan.</p></div></section><section class="panel"><div class="panelhead">Backup</div><div class="panelbody">Backup produksi akan dilakukan melalui backend atau fasilitas database, bukan hanya dari browser.<br><br><button class="btn" disabled>Backup (backend belum siap)</button></div></section>`;
else if(p==='Admin & Petugas') content.innerHTML=`<div class="notice"><b>Keamanan akun</b>Akun dan peran pengguna harus dikelola melalui backend terautentikasi. Jangan simpan password dalam HTML.</div><div class="head"><div><h1>Admin & Petugas</h1><div class="muted">Rancangan hak akses pengguna.</div></div></div><section class="panel"><table class="table"><thead><tr><th>Fitur</th><th>Admin</th><th>Petugas</th></tr></thead><tbody><tr><td>Pelanggan dan tarif</td><td>Kelola</td><td>Akses terbatas</td></tr><tr><td>Catat meter</td><td>Kelola</td><td>Input</td></tr><tr><td>Pembayaran</td><td>Kelola</td><td>Input sesuai izin</td></tr><tr><td>Akun dan backup</td><td>Kelola</td><td>Tidak</td></tr></tbody></table></section>`;
else content.innerHTML=empty(p,({Pelanggan:'Kelola identitas dan status pelanggan.',Tagihan:'Pantau tagihan bulanan dan status pembayaran.',Tunggakan:'Pantau tagihan yang belum lunas dan denda.',Laporan:'Laporan pemakaian, penerimaan, dan piutang.',Area:'Kelompokkan pelanggan berdasarkan wilayah.', 'Jenis Pelanggan':'Atur kategori pelanggan.', 'Data Meter':'Kelola meter aktif dan riwayat pergantian.'})[p]||'Data akan tampil setelah backend terhubung.')}
function form(title,fields){content.innerHTML=`<div class="head"><div><h1>${title}</h1><div class="muted">Form tampilan awal; penyimpanan diaktifkan setelah API aman terpasang.</div></div></div><section class="panel"><div class="panelhead">${title}</div><div class="panelbody"><form id="f"><div class="fields">${fields.map(f=>`<div class="field ${f[2]==='textarea'?'full':''}"><label>${f[1]}</label>${f[2]==='textarea'?`<textarea></textarea>`:f[2]==='select'?`<select><option>Pilih setelah data tersedia</option></select>`:f[2]==='method'?`<select><option value="">Pilih metode</option><option>Tunai</option><option>Transfer</option></select>`:`<input type="${f[2]==='month'?'month':f[2]==='number'?'number':'text'}" ${f[2]==='number'?'min="0" step="any"':''}>`}</div>`).join('')}</div><div class="formfoot"><button class="btn" type="reset">Kosongkan</button><button class="btn primary" type="submit">Simpan</button></div></form><p class="hint">Belum tersimpan ke database. Jangan gunakan untuk transaksi produksi.</p></div></section>`;document.getElementById('f').onsubmit=e=>{e.preventDefault();toast('Belum disimpan: backend API belum dikonfigurasi.')}}function toast(s){alert(s)}
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>page(b.dataset.p));document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');page('Dashboard');
</script></body></html>
