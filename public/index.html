<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087fc5"><title>Meter Pams — Tagihan Air Bersih</title>
<style>
:root{--blue:#0785d8;--blue2:#09649d;--navy:#12394f;--pale:#eaf5fb;--pale2:#d7eaf4;--ink:#254b60;--muted:#8499a4;--line:#c4dfed;--white:#fff;--green:#20ae70;--red:#e84b4b;--orange:#f39b08}*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}.sidebar{background:var(--blue2);color:white;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:8px 9px 24px}.logo{width:43px;height:43px;border-radius:13px;background:white;color:var(--blue);display:grid;place-items:center;font-size:28px;font-weight:900}.brand b{display:block;font-size:18px}.brand small{color:#c6e6f8}.group-label{font-size:11px;color:#b9dff5;text-transform:uppercase;letter-spacing:1px;padding:12px 11px 5px}.nav{display:grid;gap:4px}.nav button{color:#e8f6ff;background:transparent;border:0;text-align:left;border-radius:10px;padding:11px 12px}.nav button:hover,.nav button.active{background:#0789e5;color:white}.main{min-width:0}.topbar{height:76px;background:var(--blue2);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5;box-shadow:0 3px 10px #12394f18}.top-left{display:flex;align-items:center;gap:12px}.topbar small{display:block;color:#c7e7f7}.topbar strong{font-size:19px}.avatar{background:#fff;color:var(--blue2);border-radius:50%;width:39px;height:39px;display:grid;place-items:center;font-weight:800}.content{max-width:1500px;margin:auto;padding:23px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.head h1{font-size:25px;margin:0 0 3px;color:var(--ink)}.muted{color:var(--muted)}.btn{border:0;border-radius:10px;padding:11px 15px;background:#d8edf8;color:var(--ink);font-weight:650}.btn.primary{background:var(--blue);color:white}.btn.warn{background:var(--orange);color:white}.btn.danger{background:var(--red);color:white}.btn.success{background:var(--green);color:white}.btn.small{padding:7px 10px;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.control{min-height:46px;border:1px solid var(--line);background:white;border-radius:10px;padding:10px 13px;color:var(--ink);min-width:145px}.search{flex:1;min-width:190px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:16px 0}.metric,.panel,.item{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 4px 14px #1e66800b}.metric{padding:17px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:26px;margin:8px 0}.metric .symbol{float:right;width:37px;height:37px;border-radius:12px;background:var(--pale);color:var(--blue);display:grid;place-items:center;font-size:19px}.panel{overflow:hidden;margin:15px 0}.panel-title{padding:15px 18px;border-bottom:1px solid #e5f0f6;font-weight:800;display:flex;align-items:center;justify-content:space-between}.panel-body{padding:17px}.empty{padding:35px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.empty .big{font-size:35px;color:var(--blue);margin-bottom:6px}.empty b{display:block;color:var(--ink);font-size:16px;margin:5px}.notice{background:#fff8e8;border:1px solid #f6dca3;color:#795a1a;padding:12px 14px;border-radius:11px;margin-bottom:15px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.progress{height:8px;background:#e8f2f7;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue);width:0}.list{display:grid;gap:12px}.item{padding:15px}.item-head{display:flex;justify-content:space-between;gap:10px}.item strong{font-size:16px}.tag{display:inline-block;padding:4px 9px;border-radius:30px;background:#e4f6ec;color:#168a55;font-size:12px;font-weight:750}.tag.red{background:#ffebeb;color:#cb3434}.tag.orange{background:#fff2db;color:#a56a00}.rowdata{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid #e5edf2;margin-top:12px;padding-top:12px}.rowdata small{display:block;color:var(--muted)}.rowdata b{font-size:15px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:600px}.table th,.table td{padding:13px;text-align:left;border-bottom:1px solid #e8f0f5}.table th{font-size:12px;color:var(--muted);text-transform:uppercase}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:750;color:#547181}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:white;color:var(--ink)}.field.full{grid-column:1/-1}.formfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}.bottomnav{display:none}.menu-btn{display:none}.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.subtabs button{border:0;background:#d9eaf4;color:var(--ink);padding:10px 14px;border-radius:10px}.subtabs button.active{background:var(--blue);color:white}.footnote{font-size:12px;color:var(--muted);margin-top:12px}
@media(max-width:900px){.shell{grid-template-columns:210px 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:17px}.topbar{padding:0 17px}}
@media(max-width:650px){.shell{display:block}.sidebar{position:fixed;z-index:20;left:-270px;top:0;width:250px;transition:left .2s;box-shadow:8px 0 25px #12394f30}.sidebar.open{left:0}.menu-btn{display:inline-block;background:transparent;border:0;color:white;font-size:25px;padding:0 3px}.topbar{height:70px;padding:0 14px}.topbar strong{font-size:17px}.content{padding:14px 11px 94px}.head h1{font-size:22px}.cards{gap:8px}.metric{padding:12px}.metric strong{font-size:22px}.metric small{font-size:12px}.grid2{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.rowdata{gap:7px}.bottomnav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--navy);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottomnav button{border:0;background:transparent;color:#c6dce7;padding:5px 2px;font-size:11px}.bottomnav button span{display:block;font-size:21px;margin-bottom:1px}.bottomnav button.active{color:white;border-bottom:3px solid var(--orange)}.toolbar .control{flex:1;min-width:125px}.search{min-width:100%;order:3}.avatar{width:34px;height:34px}.panel-body{padding:12px}.item{padding:12px}}
.login-cover{position:fixed;inset:0;background:#eaf5fb;z-index:100;display:grid;place-items:center;padding:18px}.login-card{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;width:min(440px,100%);box-shadow:0 15px 50px #12394f20}.login-card h1{margin:0 0 5px}.login-card .field{margin:12px 0}.connection{font-size:12px;color:#d6efff;margin-top:5px}.api-status{padding:10px 13px;border-radius:9px;background:#e4f6ec;color:#168a55;margin-bottom:12px}.api-status.err{background:#ffebeb;color:#b22}.record-list{display:grid;gap:9px}.record{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.record small{display:block;color:var(--muted);overflow-wrap:anywhere}.record-actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:650px){.login-card{padding:18px}}
</style></head><body>
<div class="login-cover" id="loginCover"><div class="login-card"><div class="brand" style="padding:0 0 14px;color:var(--ink)"><div class="logo">≈</div><div><b>Meter Pams</b><small style="color:var(--muted);display:block">Login Admin / Petugas</small></div></div><h1>Masuk aplikasi</h1><form id="loginForm"><div class="field"><label>Nomor HP</label><input id="loginPhone" type="tel" inputmode="tel" autocomplete="username" placeholder="08xxxxxxxxxx" required></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%" type="submit">Masuk</button><div id="loginError" class="footnote" role="status"></div></form></div></div><div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">≈</div><div><b>Meter Pams</b><small>Manajemen Air Bersih</small></div></div><div class="group-label">Menu utama</div><nav class="nav"><button class="active" data-page="Dashboard">▦ &nbsp; Dashboard</button><button data-page="Pelanggan">♙ &nbsp; Data Pelanggan</button><button data-page="Catat Meter">◷ &nbsp; Catat Meter</button><button data-page="Tagihan">▤ &nbsp; Tagihan</button><button data-page="Pembayaran">↗ &nbsp; Pembayaran</button><button data-page="Tunggakan">! &nbsp; Tunggakan</button><button data-page="Laporan">▥ &nbsp; Laporan</button></nav><div class="group-label">Pengaturan</div><nav class="nav"><button data-page="Area">⌖ &nbsp; Area</button><button data-page="Jenis Pelanggan">◇ &nbsp; Golongan</button><button data-page="Data Meter">◉ &nbsp; Riwayat Meter</button><button data-page="Tarif Bertingkat">≋ &nbsp; Tarif Bertingkat</button><button data-page="Admin & Petugas">♧ &nbsp; Admin & Petugas</button><button data-page="Pengaturan & Backup">⚙ &nbsp; Setting & Backup</button></nav></aside>
<main class="main"><header class="topbar"><div class="top-left"><button class="menu-btn" id="menu">☰</button><div><small>BUMDesa / Layanan Air Bersih</small><strong id="pageTitle">Dashboard</strong><div class="connection" id="connectionStatus"></div></div></div><button class="avatar" id="logoutBtn" title="Keluar" style="border:0">A</button></header><div class="content" id="content"></div></main></div>
<nav class="bottomnav"><button class="active" data-page="Dashboard"><span>▦</span>Dashboard</button><button data-page="Pelanggan"><span>♙</span>Pelanggan</button><button data-page="Catat Meter"><span>◷</span>Catat Meter</button><button data-page="Tagihan"><span>▤</span>Tagihan</button></nav>
<script>
const content=document.getElementById('content');let activePage='Dashboard';
const desc={'Pelanggan':'Kelola identitas, area, golongan, dan meter pelanggan.','Catat Meter':'Pencatatan meter bulanan oleh petugas.','Tagihan':'Penerbitan dan pemantauan tagihan per periode.','Pembayaran':'Pencatatan penerimaan tunai dan transfer.','Tunggakan':'Daftar tagihan yang belum lunas dan dendanya.','Laporan':'Ringkasan operasional dan keuangan layanan air.','Area':'Kelola wilayah pelayanan.','Jenis Pelanggan':'Kelola golongan pelanggan dan pengaturan tarif.','Data Meter':'Meter aktif, pergantian meter, dan riwayat nomor seri.','Tarif Bertingkat':'Tarif progresif berdasarkan rentang pemakaian.','Admin & Petugas':'Akun pengguna dan hak akses.','Pengaturan & Backup':'Konfigurasi jatuh tempo, denda, dan pencadangan.'};
function empty(title,description,action='Tambah'){return `<section class="panel"><div class="panel-title">${title}<button class="btn primary small" onclick="openForm('${title}')">＋ ${action}</button></div><div class="panel-body"><div id="dataRows" class="record-list"><div class="empty"><div class="big">▤</div><b>Memuat data…</b>${description}</div></div></div></section>`}
function dashboard(){return `<div class="head"><div><h1>Ringkasan Operasional</h1></div><button class="btn primary" onclick="page('Catat Meter')">＋ Catat Meter</button></div><div class="cards">${[['Pelanggan Aktif','—','♙'],['Tagihan Bulan Ini','—','▤'],['Penerimaan','—','↗'],['Total Tunggakan','—','!']].map(a=>`<div class="metric"><span class="symbol">${a[2]}</span><small>${a[0]}</small><strong>${a[1]}</strong><small>Menunggu koneksi database</small></div>`).join('')}</div><div class="grid2"><section class="panel"><div class="panel-title">Progres catat meter <span class="tag">Bulanan</span></div><div class="panel-body"><div class="empty"><div class="big">◷</div><b>Belum ada data pencatatan</b></div></div></section><section class="panel"><div class="panel-title">Akses cepat</div><div class="panel-body" style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><button class="btn" onclick="page('Pelanggan')">♙ Data Pelanggan</button><button class="btn" onclick="page('Tagihan')">▤ Buat Tagihan</button><button class="btn" onclick="page('Pembayaran')">↗ Catat Bayar</button><button class="btn" onclick="page('Tunggakan')">! Tunggakan</button></div></section></div><section class="panel"><div class="panel-title">Aktivitas terbaru</div><div class="panel-body"><div class="empty"></div></div></section>`}
function formPage(p){
if(p==='Pelanggan'){
const autoId='PEL-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(16).slice(2,10).toUpperCase();
return `<div class="head"><div><h1>Tambah Pelanggan</h1></div><button class="btn" onclick="page('Pelanggan')">← Kembali</button></div><section class="panel"><div class="panel-title">Data Pelanggan</div><div class="panel-body"><form id="customerForm" onsubmit="saveCustomer(event)"><div class="fields">
<div class="field"><label for="customer_no">ID Pelanggan</label><input id="customer_no" name="customer_no" value="${autoId}" readonly required></div>
<div class="field"><label for="name">Nama pelanggan</label><input id="name" name="name" required maxlength="150"></div>
<div class="field full"><label for="address">Alamat</label><input id="address" name="address" required maxlength="500"></div>
<div class="field"><label for="phone">Nomor HP</label><input id="phone" name="phone" type="tel" maxlength="30"></div>
<div class="field"><label for="area_id">ID Area (opsional)</label><input id="area_id" name="area_id" type="number" min="1" step="1"></div>
<div class="field"><label for="customer_type_id">ID Golongan (opsional)</label><input id="customer_type_id" name="customer_type_id" type="number" min="1" step="1"></div>
<div class="field"><label for="status">Status</label><select id="status" name="status"><option value="active">Aktif</option><option value="inactive">Nonaktif</option></select></div>
</div><div id="customerSaveMsg" class="footnote" role="status"></div><div class="formfoot"><button type="button" class="btn" onclick="page('Pelanggan')">Batal</button><button class="btn primary" id="saveCustomerBtn" type="submit">Simpan Pelanggan</button></div></form></div></section>`
}
let fields={
'Catat Meter':[['period','Periode tagihan','month'],['customer_id','ID Pelanggan','number'],['previous_reading','Angka meter awal (m³)','number'],['current_reading','Angka meter akhir (m³)','number'],['condition','Kondisi meter','select'],['photo','Foto meter (opsional)','file'],['notes','Catatan','textarea']],
'Tagihan':[['period','Periode tagihan','month'],['customer_id','ID Pelanggan','number'],['usage_m3','Pemakaian (m³)','number'],['total_amount','Total tagihan (Rp)','number'],['due_date','Tanggal jatuh tempo','date']],
'Pembayaran':[['bill_id','ID Tagihan','number'],['payment_date','Tanggal pembayaran','date'],['amount','Jumlah pembayaran (Rp)','number'],['method','Metode pembayaran','select'],['reference_no','Nomor referensi transfer','text']],
'Area':[['name','Nama area','text'],['description','Keterangan','textarea']],
'Jenis Pelanggan':[['name','Nama golongan','text'],['description','Keterangan','textarea']],
'Data Meter':[['customer_id','ID Pelanggan','number'],['meter_no','Nomor seri meter','text'],['initial_reading','Angka awal meter','number'],['status','Status','select']],
'Tarif Bertingkat':[['customer_type_id','ID Golongan','number'],['min_usage','Dari pemakaian (m³)','number'],['max_usage','Sampai pemakaian (m³)','number'],['rate_per_m3','Tarif per m³ (Rp)','number']],
'Admin & Petugas':[['name','Nama petugas','text'],['email','Email akun','email'],['role','Hak akses','select'],['area_id','ID Area tugas','number']],
'Pengaturan & Backup':[['business_name','Nama BUMDesa','text'],['monthly_penalty','Denda bulanan (Rp)','number'],['due_day','Tanggal jatuh tempo (1–28)','number']]
};let f=fields[p]||[];return `<div class="head"><div><h1>${p}</h1></div><button class="btn" onclick="page('${p}')">← Kembali</button></div><section class="panel"><div class="panel-title">Form ${p}</div><div class="panel-body"><form onsubmit="event.preventDefault();alert('Form untuk menu ini belum diaktifkan.');"><div class="fields">${f.map(a=>`<div class="field ${a[2]==='textarea'?'full':''}"><label for="f_${a[0]}">${a[1]}</label>${a[2]==='textarea'?`<textarea id="f_${a[0]}" name="${a[0]}" rows="3"></textarea>`:a[2]==='select'?`<select id="f_${a[0]}" name="${a[0]}"><option value="">Pilih</option>${a[0]==='method'?'<option value="cash">Tunai</option><option value="transfer">Transfer</option>':a[0]==='role'?'<option value="admin">Admin</option><option value="staff">Petugas</option>':a[0]==='status'?'<option value="active">Aktif</option><option value="inactive">Nonaktif</option>':a[0]==='condition'?'<option value="good">Baik</option><option value="damaged">Rusak</option>':''}</select>`:`<input id="f_${a[0]}" name="${a[0]}" type="${a[2]}" ${a[2]==='number'?'min="0" step="any"':''}>`}</div>`).join('')}</div><div class="formfoot"><button type="button" class="btn" onclick="page('${p}')">Batal</button><button class="btn primary" type="submit">Simpan</button></div></form></div></section>`}

function pageInner(p){activePage=p;document.getElementById('pageTitle').textContent=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('sidebar').classList.remove('open');if(p==='Dashboard'){content.innerHTML=dashboard();return}if(p==='Pelanggan'){content.innerHTML=`<div class="head"><div><h1>Data Pelanggan</h1><div class="muted">${desc[p]}</div></div><button class="btn primary" onclick="openForm('Pelanggan')">＋ Pelanggan</button></div><div class="toolbar"><select class="control"><option>Semua status</option><option>Aktif</option><option>Nonaktif</option></select><select class="control"><option>Semua area</option></select><input class="control search" placeholder="⌕ Cari nomor / nama pelanggan..."></div>${empty('Daftar pelanggan',desc[p],'Tambah Pelanggan')}`;return}if(p==='Catat Meter'){content.innerHTML=`<div class="head"><div><h1>Data Meter Bulanan</h1><div class="muted">${desc[p]}</div></div><button class="btn primary" onclick="openForm('Catat Meter')">＋ Catat Meter</button></div><div class="toolbar"><input class="control" type="month" value=""><select class="control"><option>Semua area</option></select><select class="control"><option>Semua status</option><option>Belum dicatat</option><option>Sudah dicatat</option></select><input class="control search" placeholder="⌕ Cari pelanggan..."></div><div class="cards">${[['Pelanggan','—'],['Sudah dicatat','—'],['Belum dicatat','—'],['Volume air','— m³']].map(a=>`<div class="metric"><small>${a[0]}</small><strong>${a[1]}</strong></div>`).join('')}</div>${empty('Daftar pencatatan meter',desc[p])}`;return}if(p==='Tagihan'){content.innerHTML=`<div class="head"><div><h1>Tagihan Air</h1><div class="muted">${desc[p]}</div></div><button class="btn primary" onclick="openForm('Tagihan')">＋ Buat Tagihan</button></div><div class="toolbar"><input class="control" type="month"><select class="control"><option>Semua status pembayaran</option><option>Belum lunas</option><option>Lunas</option></select><select class="control"><option>Semua area</option></select><input class="control search" placeholder="⌕ Cari pelanggan atau nomor tagihan..."></div><div class="subtabs"><button class="active">Tagihan</button><button>Rincian tagihan</button><button>Belum catat meter</button></div>${empty('Daftar tagihan',desc[p])}`;return}if(p==='Pembayaran'){content.innerHTML=`<div class="head"><div><h1>Pembayaran</h1><div class="muted">${desc[p]}</div></div><button class="btn primary" onclick="openForm('Pembayaran')">＋ Catat Pembayaran</button></div><div class="toolbar"><input class="control" type="month"><select class="control"><option>Semua metode</option><option>Tunai</option><option>Transfer</option></select><input class="control search" placeholder="⌕ Cari nama / nomor tagihan..."></div>${empty('Riwayat pembayaran',desc[p])}`;return}if(p==='Tarif Bertingkat'){content.innerHTML=`<div class="head"><div><h1>Tarif Dasar Air</h1><div class="muted">Tarif progresif untuk setiap golongan pelanggan.</div></div><button class="btn primary" onclick="openForm('Tarif Bertingkat')">＋ Tambah Level</button></div><div class="subtabs"><button class="active">Tarif Level Meter</button><button onclick="page('Jenis Pelanggan')">Golongan</button><button>Biaya Non-Air</button></div>${empty('Level tarif',desc[p],'Tambah Level Tarif')}`;return}if(p==='Tunggakan'){content.innerHTML=`<div class="head"><div><h1>Tunggakan Pelanggan</h1><div class="muted">${desc[p]}</div></div></div><div class="toolbar"><input class="control" type="month"><select class="control"><option>Semua area</option></select><input class="control search" placeholder="⌕ Cari pelanggan..."></div><div class="cards">${[['Jumlah pelanggan','—'],['Total tunggakan','—'],['Total denda','—'],['Tagihan tertua','—']].map(a=>`<div class="metric"><small>${a[0]}</small><strong>${a[1]}</strong></div>`).join('')}</div>${empty('Daftar tunggakan',desc[p])}`;return}if(p==='Laporan'){content.innerHTML=`<div class="head"><div><h1>Laporan</h1><div class="muted">${desc[p]}</div></div></div><div class="toolbar"><input class="control" type="date"><input class="control" type="date"><button class="btn primary" onclick="alert('Ekspor akan aktif setelah API dan data tersedia.')">⇩ Ekspor laporan</button></div><div class="grid2">${[['Laporan pemakaian','Volume air per periode dan area.'],['Laporan tagihan','Nilai tagihan dan status pelunasan.'],['Laporan penerimaan','Tunai, transfer, dan rekap harian.'],['Laporan tunggakan','Piutang dan denda per pelanggan.']].map(a=>`<section class="panel"><div class="panel-title">${a[0]}</div><div class="panel-body">${a[1]}<p><button class="btn small" onclick="alert('Laporan akan tersedia setelah database terhubung.')">Buka laporan</button></p></div></section>`).join('')}</div>`;return}if(p==='Pengaturan & Backup'){content.innerHTML=formPage(p)+`<section class="panel"><div class="panel-title">Pencadangan data</div><div class="panel-body">Backup produksi perlu dijalankan melalui backend/database, dengan akses khusus admin. <button class="btn" onclick="alert('Backup dinonaktifkan sampai backend aman siap.')">Backup database</button></div></section>`;return}content.innerHTML=`<div class="head"><div><h1>${p}</h1><div class="muted">${desc[p]||''}</div></div><button class="btn primary" onclick="openForm('${p}')">＋ Tambah</button></div>${empty(p,desc[p]||'Data akan ditampilkan di sini.')}`}
function openForm(p){content.innerHTML=formPage(p);document.getElementById('pageTitle').textContent='Tambah '+p}
async function saveCustomer(ev){ev.preventDefault();const form=document.getElementById('customerForm');const msg=document.getElementById('customerSaveMsg');const btn=document.getElementById('saveCustomerBtn');if(!form||!API.token){if(msg)msg.textContent='Silakan login kembali.';return}const fd=new FormData(form);const body={customer_no:String(fd.get('customer_no')||'').trim(),name:String(fd.get('name')||'').trim(),address:String(fd.get('address')||'').trim(),phone:String(fd.get('phone')||'').trim(),status:String(fd.get('status')||'active')};for(const k of ['area_id','customer_type_id']){const v=String(fd.get(k)||'').trim();if(v)body[k]=Number(v)}if(!body.name||!body.address){msg.textContent='Nama dan alamat wajib diisi.';return}btn.disabled=true;btn.textContent='Menyimpan…';msg.textContent='';try{const result=await api('/api/customers',{method:'POST',body:JSON.stringify(body)});const saved=result.data||result.customer||result;const generated=saved.customer_no||body.customer_no;alert('Pelanggan berhasil disimpan. ID Pelanggan: '+generated);page('Pelanggan')}catch(e){msg.textContent='Gagal menyimpan: '+e.message;btn.disabled=false;btn.textContent='Simpan Pelanggan'}}

const API_BASE='https://meterpams.iroel-setyawan.workers.dev';
const API={base:API_BASE,token:'',username:'',role:''};
const tableForPage={'Pelanggan':'customers','Catat Meter':'meter_readings','Tagihan':'bills','Pembayaran':'payments','Area':'areas','Jenis Pelanggan':'customer_types','Data Meter':'meters','Tarif Bertingkat':'tariff_brackets','Pengaturan & Backup':'app_settings'};
const displayFields={customers:[['customer_no','ID Pelanggan'],['name','Nama'],['address','Alamat'],['phone','Telepon'],['status','Status']],areas:[['name','Nama area'],['description','Keterangan']],customer_types:[['name','Nama golongan'],['description','Keterangan'],['is_active','Aktif']],meters:[['meter_no','Nomor seri meter'],['customer_id','ID pelanggan'],['initial_reading','Angka awal'],['status','Status']],meter_readings:[['period','Periode'],['meter_id','ID meter'],['previous_reading','Angka awal'],['current_reading','Angka akhir'],['usage_m3','Pemakaian m³']],tariff_brackets:[['customer_type_id','Golongan ID'],['min_usage','Dari m³'],['max_usage','Sampai m³'],['rate_per_m3','Tarif/m³']],bills:[['bill_no','No. tagihan'],['customer_id','ID pelanggan'],['period','Periode'],['usage_m3','Pemakaian'],['total_amount','Total'],['paid_amount','Terbayar'],['status','Status']],payments:[['bill_id','ID tagihan'],['payment_date','Tanggal'],['amount','Nominal'],['method','Metode'],['reference_no','Referensi']],app_settings:[['business_name','Nama usaha'],['monthly_penalty','Denda bulanan'],['due_day','Jatuh tempo']]};
function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setStatus(msg,err=false){const e=document.getElementById('connectionStatus');if(e)e.textContent=msg;const l=document.getElementById('loginError');if(err&&l)l.textContent=msg}
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(API.token)headers.Authorization='Bearer '+API.token;let r=await fetch(API.base.replace(/\/$/,'')+path,{...opts,headers});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function showApp(){document.getElementById('loginCover').style.display='none';document.querySelector('.avatar').textContent=(API.username||'A').slice(0,1).toUpperCase();setStatus('Terhubung • '+API.role);page('Dashboard')}
async function connectLogin(ev){ev.preventDefault();const base=API_BASE;const phone=document.getElementById('loginPhone').value.trim();const password=document.getElementById('loginPass').value;const err=document.getElementById('loginError');err.textContent='Menghubungkan…';try{const h=await fetch(base+'/api/health');if(!h.ok)throw new Error('API belum bisa dijangkau. Periksa URL Worker.');const health=await h.json();if(!health.ok)throw new Error('Worker tidak dapat terhubung ke database Neon.');const r=await fetch(base+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:phone,password})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Login gagal');API.base=base;API.token=j.token;API.username=j.username||phone;API.role=j.role;sessionStorage.setItem('meterpams_api',base);sessionStorage.setItem('meterpams_token',j.token);sessionStorage.setItem('meterpams_user',j.username);sessionStorage.setItem('meterpams_role',j.role);document.getElementById('loginPass').value='';err.textContent='';showApp()}catch(e){err.textContent=e.message;setStatus('Koneksi gagal',true)}}
document.getElementById('loginForm').addEventListener('submit',connectLogin);
document.getElementById('logoutBtn').addEventListener('click',()=>{API.token='';API.username='';API.role='';sessionStorage.removeItem('meterpams_token');sessionStorage.removeItem('meterpams_user');sessionStorage.removeItem('meterpams_role');document.getElementById('loginCover').style.display='grid';setStatus('Keluar dari aplikasi')});
async function loadForPage(p){const table=tableForPage[p];if(!table||!API.token)return;const target=document.getElementById('dataRows');if(!target)return;target.innerHTML='<div class="empty">Memuat data dari Neon…</div>';try{const j=await api('/api/'+table+'?limit=200');const rows=j.data||[];if(!rows.length){target.innerHTML='<div class="empty"><div class="big">▤</div><b>Belum ada data</b></div>';return}const fields=displayFields[table]||Object.keys(rows[0]).filter(k=>k!=='id'&&k!=='created_at').slice(0,5).map(k=>[k,k]);target.innerHTML=rows.map(row=>`<article class="record"><div><b>${esc((fields.find(f=>f[0]==='name')&&row.name)||row.name||row.customer_no||row.bill_no||row.meter_no||('ID '+row.id))}</b><small>${fields.filter(f=>!['name'].includes(f[0])).map(f=>esc(f[1])+': '+esc(row[f[0]])).join(' · ')}</small></div>${API.role==='admin'?`<div class="record-actions"><button class="btn small danger" onclick="deleteRecord('${table}',${Number(row.id)})">Hapus</button></div>`:''}</article>`).join('')}catch(e){target.innerHTML=`<div class="empty"><b>Gagal memuat data</b>${esc(e.message)}<p class="footnote"></p><button class="btn small" onclick="loadForPage('${p}')">Coba lagi</button></div>`}}
async function deleteRecord(table,id){if(API.role!=='admin'||!confirm('Hapus data ini? Tindakan ini dapat memengaruhi relasi tagihan/pembayaran.'))return;try{await api('/api/'+table+'?id='+id,{method:'DELETE'});await loadForPage(activePage)}catch(e){alert(e.message)}}
function page(p){pageInner(p);loadForPage(p)}
(function restoreSession(){const base=API_BASE,token=sessionStorage.getItem('meterpams_token');if(token){API.base=base;API.token=token;API.username=sessionStorage.getItem('meterpams_user')||'';API.role=sessionStorage.getItem('meterpams_role')||'';showApp()}else{document.getElementById('loginCover').style.display='grid'}})();

document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>page(b.dataset.page)));document.getElementById('menu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));pageInner('Dashboard');
</script></body></html>
